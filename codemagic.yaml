workflows:
  flutter-release-workflow:
    name: Build Android Release APK
    max_build_duration: 60
    environment:
      flutter: 3.19.6  # Use a stable modern Flutter version
      vars:
        PACKAGE_NAME: "com.example.brick_r"

    scripts:
      - name: 🔹 Clean and get packages
        script: |
          flutter clean
          flutter pub get

      - name: 🔹 Remove old Gradle and build caches
        script: |
          rm -rf android/.gradle
          rm -rf android/app/build

      - name: 🔹 Upgrade Gradle wrapper
        script: |
          ./gradlew wrapper --gradle-version 8.6 --distribution-type all

      - name: 🔹 Build release APK
        script: |
          flutter build apk --release --build-name=1.0.0 --build-number=1

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
