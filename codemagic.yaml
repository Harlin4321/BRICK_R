workflows:
  build-android-release:
    name: Build Android Release APK
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.example.brick_r"
      groups:
        - keystore_credentials
      android_signing:
        - keystore_credentials
      cache:
        cache_paths:
          - $HOME/.pub-cache
          - $HOME/.gradle/caches
          - $HOME/.gradle/wrapper
    scripts:
      - name: 🔹 Clean project
        script: |
          flutter clean
          flutter pub get

      - name: 🔹 Analyze project
        script: |
          flutter analyze || true

      - name: 🔹 Build release APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - your-kr7013650812@gmail.com
          
