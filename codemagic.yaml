workflows:
  build-android-release:
    name: Build Android Release APK (Signed)
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.example.brick_r"
    scripts:
      - name: 🔹 Clean project
        script: |
          flutter clean
          flutter pub get

      - name: 🔹 Build signed release APK
        script: |
          flutter build apk --release \
            --build-name=1.0.0 --build-number=1

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - your-kr7013650812@gmail.com
    android_signing:
      keystore_reference: keystore_credentials
      keystore_password: $KEYSTORE_PASSWORD
      key_alias: $KEY_ALIAS
      key_password: $KEY_PASSWORD
      
          
          
