workflows:
  flutter-release-workflow:
    name: Build Android Release APK
    max_build_duration: 60
    environment:
      flutter: 3.35.5  # Modern Flutter version with Dart 3.5+
      vars:
        PACKAGE_NAME: "com.example.brick_r"

    scripts:
      - name: 🔹 Clear all caches (plugins, Gradle, builds)
        script: |
          rm -rf ~/.pub-cache
          rm -rf android/.gradle
          rm -rf android/app/build
          rm -rf build
          flutter clean

      - name: 🔹 Get packages
        script: |
          flutter pub get

      - name: 🔹 Build release APK
        script: |
          flutter build apk --release --build-name=1.0.0 --build-number=1

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
