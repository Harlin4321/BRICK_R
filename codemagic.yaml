workflows:
  flutter-release-workflow:
    name: Flutter Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: 🔹 Get Flutter dependencies
        script: |
          flutter pub get

      - name: 🔹 Analyze project
        script: |
          flutter analyze

      - name: 🔹 Run tests
        script: |
          flutter test || true

      - name: 🔹 Build release APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - kr70136508@gmail.com
          
          
